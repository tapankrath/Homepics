<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    touch-action: pan-y;
  }
  #track {
    display: flex;
    height: 100%;
    will-change: transform;
  }
  .slide {
    flex: 0 0 100vw;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #counter {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    letter-spacing: 0.5px;
    z-index: 10;
    pointer-events: none;
  }
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    color: #fff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #prevBtn { left: 12px; }
  #nextBtn { right: 12px; }
  @media (max-width: 600px) {
    .nav-btn {
      width: 38px;
      height: 38px;
      font-size: 18px;
      background: rgba(0,0,0,0.55);
    }
  }
  #dots {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 10;
    max-width: 90vw;
    overflow-x: auto;
    padding: 4px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    flex: 0 0 auto;
    transition: background 0.2s;
  }
  .dot.active {
    background: #fff;
  }
</style>
</head>
<body>

<div id="counter">1 / 38</div>
<button class="nav-btn" id="prevBtn">&#8249;</button>
<button class="nav-btn" id="nextBtn">&#8250;</button>
<div id="viewport">
  <div id="track">
    <div class="slide"><img src="images/img_01.jpg" alt="Photo 1" loading="lazy"></div>
    <div class="slide"><img src="images/img_02.jpg" alt="Photo 2" loading="lazy"></div>
    <div class="slide"><img src="images/img_03.jpg" alt="Photo 3" loading="lazy"></div>
    <div class="slide"><img src="images/img_04.jpg" alt="Photo 4" loading="lazy"></div>
    <div class="slide"><img src="images/img_05.jpg" alt="Photo 5" loading="lazy"></div>
    <div class="slide"><img src="images/img_06.jpg" alt="Photo 6" loading="lazy"></div>
    <div class="slide"><img src="images/img_07.jpg" alt="Photo 7" loading="lazy"></div>
    <div class="slide"><img src="images/img_08.jpg" alt="Photo 8" loading="lazy"></div>
    <div class="slide"><img src="images/img_09.jpg" alt="Photo 9" loading="lazy"></div>
    <div class="slide"><img src="images/img_10.jpg" alt="Photo 10" loading="lazy"></div>

    <div class="slide"><img src="images/img_12.jpg" alt="Photo 12" loading="lazy"></div>

    <div class="slide"><img src="images/img_16.jpg" alt="Photo 16" loading="lazy"></div>
    <div class="slide"><img src="images/img_17.jpg" alt="Photo 17" loading="lazy"></div>
    <div class="slide"><img src="images/img_18.jpg" alt="Photo 18" loading="lazy"></div>
    <div class="slide"><img src="images/img_19.jpg" alt="Photo 19" loading="lazy"></div>
    <div class="slide"><img src="images/img_20.jpg" alt="Photo 20" loading="lazy"></div>
    <div class="slide"><img src="images/img_21.jpg" alt="Photo 21" loading="lazy"></div>
    <div class="slide"><img src="images/img_22.jpg" alt="Photo 22" loading="lazy"></div>
    <div class="slide"><img src="images/img_23.jpg" alt="Photo 23" loading="lazy"></div>
    <div class="slide"><img src="images/img_24.jpg" alt="Photo 24" loading="lazy"></div>

    <div class="slide"><img src="images/img_37.jpg" alt="Photo 37" loading="lazy"></div>
    <div class="slide"><img src="images/img_38.jpg" alt="Photo 38" loading="lazy"></div>
  </div>
</div>
<div id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<script>
  const viewport = document.getElementById('viewport');
  const track = document.getElementById('track');
  const slides = document.querySelectorAll('.slide');
  const counter = document.getElementById('counter');
  const dots = document.querySelectorAll('.dot');
  const total = slides.length;
  let current = 0;

  function render(animate) {
    track.style.transition = animate ? 'transform 0.3s ease' : 'none';
    track.style.transform = 'translateX(' + (-current * viewport.clientWidth) + 'px)';
    counter.textContent = (current + 1) + ' / ' + total;
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
  }

  function goTo(index) {
    if (index < 0) index = 0;
    if (index > total - 1) index = total - 1;
    current = index;
    render(true);
  }

  document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
  dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });

  window.addEventListener('resize', () => render(false));

  // Touch swipe support
  let startX = 0, startY = 0, deltaX = 0, dragging = false;

  viewport.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    deltaX = 0;
    dragging = true;
    track.style.transition = 'none';
  }, { passive: true });

  viewport.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    deltaX = x - startX;
    const deltaY = y - startY;
    if (Math.abs(deltaX) > Math.abs(deltaY)) {
      track.style.transform = 'translateX(' + (-current * viewport.clientWidth + deltaX) + 'px)';
    }
  }, { passive: true });

  viewport.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    const threshold = viewport.clientWidth * 0.15;
    if (deltaX < -threshold) {
      goTo(current + 1);
    } else if (deltaX > threshold) {
      goTo(current - 1);
    } else {
      render(true);
    }
  });

  // Mouse drag support (desktop)
  let mouseDown = false;
  viewport.addEventListener('mousedown', (e) => {
    mouseDown = true;
    startX = e.clientX;
    deltaX = 0;
    track.style.transition = 'none';
  });
  window.addEventListener('mousemove', (e) => {
    if (!mouseDown) return;
    deltaX = e.clientX - startX;
    track.style.transform = 'translateX(' + (-current * viewport.clientWidth + deltaX) + 'px)';
  });
  window.addEventListener('mouseup', () => {
    if (!mouseDown) return;
    mouseDown = false;
    const threshold = viewport.clientWidth * 0.15;
    if (deltaX < -threshold) {
      goTo(current + 1);
    } else if (deltaX > threshold) {
      goTo(current - 1);
    } else {
      render(true);
    }
  });

  render(false);
</script>
</body>
</html>
